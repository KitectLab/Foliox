name: Snapshot Build

on:
  push:
    branches: [ "master" ]
  schedule:
    # 10:17 Asia/Shanghai on the first day of each month.
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  build:

    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KITECTLAB_PROJECT_BUILD_TYPE: snapshot

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run core JVM tests
        run: ./gradlew :foliox-core:jvmTest --stacktrace
      - name: Publish snapshot
        run: |
          ./gradlew :foliox-core:publishToMavenCentral --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
